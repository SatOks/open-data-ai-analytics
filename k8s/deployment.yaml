# Deployment for ODAA Web Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odaa-web
  namespace: odaa
  labels:
    app: odaa-web
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odaa-web
  template:
    metadata:
      labels:
        app: odaa-web
        version: v1.0.0
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      initContainers:
        - name: init-html
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              cat > /html/index.html << 'HTMLEOF'
              <!DOCTYPE html>
              <html>
              <head>
                  <title>ODAA - GitOps Demo</title>
                  <style>
                      body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: #eee; }
                      .container { max-width: 800px; margin: 0 auto; }
                      h1 { color: #3282b8; }
                      .status { background: #16213e; padding: 20px; border-radius: 8px; margin: 20px 0; }
                      .version { color: #00ff88; font-size: 24px; }
                  </style>
              </head>
              <body>
                  <div class="container">
                      <h1>🚀 Open Data AI Analytics</h1>
                      <div class="status">
                          <p class="version">Version: v1.0.0</p>
                          <p>Deployed via ArgoCD GitOps</p>
                          <p>Status: Running on Kubernetes (k3s)</p>
                      </div>
                  </div>
              </body>
              </html>
              HTMLEOF
          volumeMounts:
            - name: html
              mountPath: /html
      volumes:
        - name: html
          emptyDir: {}
